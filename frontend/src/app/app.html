<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h1>Dati dal Backend</h1>
  <table border="1" style="border-collapse: collapse; width: 100%; text-align: left;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrizione</th>
      </tr>
    </thead>
    <tbody>
      @for (item of data; track item.Id) {
        <tr>
          <td>{{ item.Id }}</td>
          <td>{{ item.Name }}</td>
          <td>{{ item.Description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
