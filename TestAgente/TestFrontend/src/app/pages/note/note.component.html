<div class="container">
  <div class="header">
    <h2>Note</h2>
    <button class="btn btn-primary" (click)="openNewForm()">+ Nuova Nota</button>
  </div>

  <!-- Form -->
  <div class="form-container" *ngIf="showForm">
    <h3>{{ editMode ? 'Modifica Nota' : 'Nuova Nota' }}</h3>
    <form (ngSubmit)="save()">
      <div class="form-group">
        <label>Progetto *</label>
        <select [(ngModel)]="form.progettoId" name="progettoId" required>
          <option value="0">-- Seleziona Progetto --</option>
          <option *ngFor="let p of progetti" [value]="p.id">{{ p.nome }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Titolo</label>
        <input type="text" [(ngModel)]="form.titolo" name="titolo" placeholder="Titolo della nota" />
      </div>
      <div class="form-group">
        <label>Contenuto *</label>
        <textarea [(ngModel)]="form.contenuto" name="contenuto" rows="5" required placeholder="Scrivi la tua nota..."></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-success">Salva</button>
        <button type="button" class="btn btn-secondary" (click)="closeForm()">Annulla</button>
      </div>
    </form>
  </div>

  <!-- Lista Note -->
  <div class="list-container">
    <div class="card" *ngFor="let n of note" [class.selected]="selectedNota?.id === n.id">
      <div class="card-header">
        <div>
          <span class="date">{{ formatDate(n.dataCreazione) }}</span>
          <span class="badge" [style.background]="getBadgeBackground(getClienteNomeDaProgetto(n.progettoId))" [style.color]="'#e8f0fe'" [style.border]="'1px solid ' + getBadgeBorder(getClienteNomeDaProgetto(n.progettoId))">{{ getClienteNomeDaProgetto(n.progettoId) }}</span>
          <span class="badge" [style.background]="getBadgeBackground(getProgettoNome(n.progettoId))" [style.color]="'#e8f5e9'" [style.border]="'1px solid ' + getBadgeBorder(getProgettoNome(n.progettoId))">{{ getProgettoNome(n.progettoId) }}</span>
        </div>
        <div class="actions">
          <button class="btn btn-sm btn-edit" (click)="openEditForm(n)">Modifica</button>
          <button class="btn btn-sm btn-delete" (click)="delete(n.id)">Elimina</button>
        </div>
      </div>
      <div class="card-body">
        <h4 *ngIf="n.titolo">{{ n.titolo }}</h4>
        <p>{{ n.contenuto }}</p>
      </div>
    </div>

    <div class="empty" *ngIf="note.length === 0">
      Nessuna nota presente. Aggiungi la tua prima nota!
    </div>
  </div>
</div>
